name: Build container images

on:
  pull_request:
  push:
    branches:
      - develop
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  helm:
    name: Validate Helm charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Lint charts
        run: |
          helm lint k3s/helm/enerflux-infrastructure
          helm lint k3s/helm/enerflux

      - name: Render charts
        run: |
          helm template enerflux-infrastructure k3s/helm/enerflux-infrastructure >/dev/null
          helm template enerflux k3s/helm/enerflux >/dev/null

  images:
    name: Build ${{ matrix.target }} image
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: api
            image: enerflux-api
          - target: agent
            image: enerflux-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize repository owner
        id: repository
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repository.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
