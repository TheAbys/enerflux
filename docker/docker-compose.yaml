services:
  db:
    image: postgres:16
    container_name: enerflux-db
    environment:
      POSTGRES_USER: enerflux
      POSTGRES_PASSWORD: enerflux
      POSTGRES_DB: enerflux
    ports:
      - "5432:5432"
    volumes:
      - enerflux_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

volumes:
  enerflux_data:
  mosquitto_data: