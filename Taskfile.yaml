version: '3'


tasks:
  api:
    cmds:
      - set -a && source .env && set +a && go run ./cmd/api
      
  agent:
    cmds:
      - set -a && source .env && set +a && go run ./cmd/agent

  dev:
    cmds:
      - task --parallel api agent

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  build:
    desc: Build binary
    cmds:
      - go build -o bin/enerflux ./cmd/api