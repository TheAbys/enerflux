apiVersion: v1
kind: Service
metadata:
  name: enerflux-postgres
  labels:
    app.kubernetes.io/name: enerflux-postgres
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: enerflux-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: enerflux-postgres
  labels:
    app.kubernetes.io/name: enerflux-postgres
spec:
  serviceName: enerflux-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enerflux-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enerflux-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: enerflux-db-auth
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: enerflux-mqtt
  labels:
    app.kubernetes.io/name: enerflux-mqtt
spec:
  type: NodePort
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      nodePort: 31883
  selector:
    app.kubernetes.io/name: enerflux-mqtt
---
apiVersion: v1
kind: Service
metadata:
  name: enerflux-mqtt-headless
  labels:
    app.kubernetes.io/name: enerflux-mqtt
spec:
  clusterIP: None
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
  selector:
    app.kubernetes.io/name: enerflux-mqtt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: enerflux-mqtt
  labels:
    app.kubernetes.io/name: enerflux-mqtt
spec:
  serviceName: enerflux-mqtt-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enerflux-mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enerflux-mqtt
    spec:
      securityContext:
        fsGroup: 1883
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: enerflux-stack-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
