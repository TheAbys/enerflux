apiVersion: v1
kind: Service
metadata:
  name: enerflux-postgres
  labels:
    app.kubernetes.io/name: enerflux-postgres
{{ include "enerflux-infrastructure.labels" . | indent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: enerflux-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: enerflux-postgres
  labels:
    app.kubernetes.io/name: enerflux-postgres
{{ include "enerflux-infrastructure.labels" . | indent 4 }}
spec:
  serviceName: enerflux-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enerflux-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enerflux-postgres
{{ include "enerflux-infrastructure.labels" . | indent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
{{ with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{ end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: enerflux-db-auth
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
{{ toYaml .Values.postgres.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
{{ with .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
{{ end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | quote }}
