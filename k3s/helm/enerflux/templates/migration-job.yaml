apiVersion: batch/v1
kind: Job
metadata:
  name: enerflux-migrate
  labels:
    app.kubernetes.io/name: enerflux
    app.kubernetes.io/component: migration
{{ include "enerflux.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enerflux
        app.kubernetes.io/component: migration
{{ include "enerflux.labels" . | indent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.migrations.image | quote }}
          imagePullPolicy: {{ .Values.migrations.imagePullPolicy | quote }}
          command:
            - /bin/sh
            - /migrations/migrate.sh
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.databaseAuthName }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ .Values.configMap.name }}
            defaultMode: 0444
