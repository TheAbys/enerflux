apiVersion: v1
kind: Service
metadata:
  name: enerflux-api
  labels:
    app.kubernetes.io/name: enerflux-api
{{ include "enerflux.labels" . | indent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{ if eq .Values.api.service.type "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
{{ end }}
  selector:
    app.kubernetes.io/name: enerflux-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enerflux-api
  labels:
    app.kubernetes.io/name: enerflux-api
{{ include "enerflux.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enerflux-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enerflux-api
{{ include "enerflux.labels" . | indent 8 }}
{{ if .Values.deploymentRevision }}
      annotations:
        enerflux.io/deploy-revision: {{ .Values.deploymentRevision | quote }}
{{ end }}
    spec:
{{ with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{ end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy | quote }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.appConfigName }}
          env:
            - name: API_URL
              value: http://enerflux-api:8080
            - name: API_PORT
              value: ":8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseAuthName }}
                  key: {{ .Values.secrets.databaseUrlKey }}
            - name: MQTT_BROKER_URL
              value: tcp://enerflux-mqtt:1883
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
