apiVersion: batch/v1
kind: Job
metadata:
  generateName: enerflux-migrate-
  labels:
    app.kubernetes.io/name: enerflux
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enerflux
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /migrations/migrate.sh
          envFrom:
            - secretRef:
                name: enerflux-db-auth
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: enerflux-stack-config
            defaultMode: 0444
